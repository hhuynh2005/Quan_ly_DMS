<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="study_docs_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Quản Lý Tài Liệu Học Tập (Cashew Architecture)</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#004D40;">
    <div style="width:48px;height:48px;border:4px solid #E0F2F1;border-top-color:#00796B;border-radius:50%;animation:cashew-spin 0.8s linear infinite;"></div>
    <div style="margin-top:16px;font-weight:600;font-size:16px;letter-spacing:0.3px;">Hệ Thống Quản Lý Tài Liệu</div>
    <div style="margin-top:6px;font-size:13px;color:#757575;">Đang tải ứng dụng và kết nối đám mây...</div>
    <style>@keyframes cashew-spin { to { transform: rotate(360deg); } }</style>
  </div>
  <script src="flutter_bootstrap.js" async></script>

</html>
